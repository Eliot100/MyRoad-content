name: Validate paths

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the schema from MyRoad main
        run: |
          # Editable install from a fresh clone: myroad-core reads its locales
          # from the repo tree, so a plain wheel install can't load them.
          git clone --depth 1 https://github.com/Eliot100/MyRoad.git /tmp/MyRoad
          python -m pip install --upgrade pip
          pip install -e "/tmp/MyRoad/packages/core[api]"

      - name: Validate every path JSON
        run: python scripts/validate_paths.py
